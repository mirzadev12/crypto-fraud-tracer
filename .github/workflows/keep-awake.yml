name: Keep the live demo awake

# Render's free plan puts the service to sleep after 15 minutes without a
# request, and the first click after that waits about 50 seconds — long enough
# for an evaluator to close the tab. This pings the health route, which reads
# nothing from the chain and renders nothing, every 10 minutes. A failed run is
# a real signal: the retries already cover a cold start or a redeploy.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 20 https://crypto-fraud-tracer.onrender.com/api/health
